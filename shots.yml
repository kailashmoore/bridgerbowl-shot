- url: https://bridgerbowl.com/weather/live#Header_Text
  output: boundaries.png
  scale_factor: 3
  width: 1480
  height: 1120
  wait: 2000
  javascript: |
    new Promise(resolve => {
      // Hide the dialog, its dark backdrop, and the small floating widget
      const style = document.createElement('style');
      style.textContent = `
        #CybotCookiebotDialog,
        #CybotCookiebotDialogBodyUnderlay,
        #CybotCookiebotWidget
        { display: none !important; visibility: hidden !important; }
        html, body { overflow: auto !important; }
      `;
      document.head.appendChild(style);

      // Click "Decline" if the dialog appears, so the choice is recorded for this session
      let tries = 0;
      const timer = setInterval(() => {
        const decline = document.querySelector('#CybotCookiebotDialogBodyButtonDecline');
        if (decline) decline.click();
        if (decline || ++tries >= 12) { clearInterval(timer); setTimeout(resolve, 1000); }
      }, 500);
    })


- url: https://www.bigskyresort.com/current-conditions#snowDepthFrame
  output: bigsky.png
  width: 1480
  height: 1120
  scale_factor: 2
  wait: 6000
  javascript: &hide_banners |
    new Promise(resolve => {
      const style = document.createElement('style');
      style.textContent = `
        #onetrust-consent-sdk, #CybotCookiebotDialog, .cc-window,
        .cookie-banner, .cookie-notice, .cookie-consent,
        [id*="cookie" i][class*="banner" i], [class*="cookie" i][class*="banner" i],
        [aria-label*="cookie" i], [aria-label*="consent" i]
        { display: none !important; visibility: hidden !important; }
        html, body { overflow: auto !important; }
      `;
      document.head.appendChild(style);
      setTimeout(resolve, 1500);
    })

