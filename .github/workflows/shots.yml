name: Take screenshot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - shots.yml
      - .github/workflows/shots.yml

permissions:
  contents: write

concurrency:
  group: screenshot
  cancel-in-progress: true

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install browser
        run: shot-scraper install

      - name: Take screenshot
        run: shot-scraper multi shots.yml

      - name: Publish to latest branch
        run: |
          set -euo pipefail
          rm -rf /tmp/publish && mkdir /tmp/publish
          cp *.png *.html /tmp/publish/
          cd /tmp/publish
          git init -q -b latest
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Screenshot $(date -u +'%Y-%m-%d %H:%M UTC')"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin latest
